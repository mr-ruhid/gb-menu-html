<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gunaydin Baku</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

.menu-box{
    width:350px;
    position:relative;
}

.menu-box img{
    width:100%;
    display:block;
}

.menu-link{
    position:absolute;
    inset:0;
}
</style>
</head>
<body>

<div class="container">

    <div class="menu-box">
        <img src="menu1.jpg" alt="Main Menu">
        <a href="menu1.pdf" class="menu-link"></a>
    </div>

    <div class="menu-box">
        <img src="menu2.jpg" alt="Steak Menu">
        <a href="menu2.pdf" class="menu-link"></a>
    </div>

</div>

</body>
</html>
