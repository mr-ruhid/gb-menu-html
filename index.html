<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Günaydın Bakı</title>

<style>
:root{
    --bg:#16100c;
    --ember:#ff9a3c;
    --cream:#fff1de;
    --ease:cubic-bezier(.2,.8,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Georgia,"Times New Roman",serif;
    color:var(--cream);
    overflow-x:hidden;
    padding:40px 0;
}

/* Hərəkət edən işıq ləkələri */
.glow{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.35;
    pointer-events:none;
    z-index:0;
}
.glow.a{width:420px;height:420px;background:#ff7a18;top:-120px;left:-100px;animation:drift 14s ease-in-out infinite alternate}
.glow.b{width:360px;height:360px;background:#c2410c;bottom:-120px;right:-80px;animation:drift 18s ease-in-out infinite alternate-reverse}

/* Qalxan buxar / ulduz hissəcikləri */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}

.container{
    position:relative;
    z-index:1;
    text-align:center;
    perspective:1200px;
}

.logo-wrap{
    display:inline-block;
    margin-bottom:50px;
    opacity:0;
    animation:drop 1s var(--ease) .1s forwards;
}
.logo{
    width:220px;
    max-width:90%;
    display:block;
    animation:float 5s ease-in-out 1.2s infinite;
    filter:drop-shadow(0 0 18px rgba(255,154,60,.45));
}
.logo-text{
    font-size:46px;
    letter-spacing:.04em;
    color:var(--ember);
    text-shadow:0 0 24px rgba(255,154,60,.6);
    animation:float 5s ease-in-out 1.2s infinite;
}

.menus{
    display:flex;
    flex-direction:column;
    gap:28px;
    align-items:center;
}

.menu{
    position:relative;
    display:block;
    width:550px;
    max-width:90vw;
    border-radius:14px;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    opacity:0;
    transform:translateY(40px) rotateX(12deg);
    animation:rise .9s var(--ease) forwards;
    box-shadow:0 14px 40px rgba(0,0,0,.55);
    transition:box-shadow .4s;
    will-change:transform;
}
.menu:nth-child(1){animation-delay:.5s}
.menu:nth-child(2){animation-delay:.8s}

.menu img{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    transition:transform .9s var(--ease), filter .5s;
    filter:brightness(.78) saturate(1.05);
}

/* Kursoru izləyən işıq */
.menu::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    opacity:0;
    transition:opacity .4s;
    background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(255,190,110,.38), transparent 70%);
}

/* Parıltı zolağı */
.menu::after{
    content:"";
    position:absolute;
    top:0;left:-70%;
    width:40%;height:100%;
    z-index:3;
    pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-20deg);
}

.menu:hover,
.menu:focus-visible{
    box-shadow:0 22px 60px rgba(255,122,24,.35);
    outline:none;
}
.menu:hover::before,
.menu:focus-visible::before{opacity:1}
.menu:hover::after,
.menu:focus-visible::after{animation:shine .9s ease}
.menu:hover img,
.menu:focus-visible img{transform:scale(1.1);filter:brightness(1) saturate(1.15)}

.label{
    position:absolute;
    left:0;right:0;bottom:0;
    z-index:4;
    padding:46px 24px 20px;
    text-align:left;
    background:linear-gradient(transparent,rgba(10,6,3,.88));
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
}
.label h2{
    font-size:28px;
    font-weight:400;
    letter-spacing:.02em;
    transform:translateY(8px);
    transition:transform .5s var(--ease);
}
.label p{
    font-size:14px;
    opacity:.75;
    margin-top:4px;
    font-family:Arial,sans-serif;
}
.arrow{
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid rgba(255,241,222,.5);
    display:grid;
    place-items:center;
    font-size:20px;
    transform:translateX(-12px);
    opacity:0;
    transition:all .5s var(--ease);
}
.menu:hover h2,
.menu:focus-visible h2{transform:translateY(0)}
.menu:hover .arrow,
.menu:focus-visible .arrow{
    transform:translateX(0);
    opacity:1;
    background:var(--ember);
    border-color:var(--ember);
    color:#16100c;
}

@keyframes rise{to{opacity:1;transform:translateY(0) rotateX(0)}}
@keyframes drop{
    from{opacity:0;transform:translateY(-30px) scale(.8)}
    to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}
@keyframes drift{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(80px,60px) scale(1.25)}
}
@keyframes shine{to{left:130%}}

@media(max-width:768px){
    .logo{width:180px}
    .menu{width:95vw}
    .label h2{font-size:22px}
    .arrow{opacity:1;transform:none}
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="glow a"></div>
<div class="glow b"></div>
<canvas id="particles"></canvas>

<div class="container">

    <div class="logo-wrap">
        <img src="logo.png" class="logo" alt="Günaydın"
             onerror="this.outerHTML='<div class=&quot;logo-text&quot;>Günaydın</div>'">
    </div>

    <div class="menus">

        <a href="/menu1/" class="menu">
            <img src="https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1200&auto=format&fit=crop" alt="Əsas menyu">
            <div class="label">
                <div>
                    <h2>Əsas menyu</h2>
                    <p>Səhər yeməkləri və daha çoxu</p>
                </div>
                <span class="arrow">→</span>
            </div>
        </a>

        <a href="/menu2/" class="menu">
            <img src="https://images.unsplash.com/photo-1546833999-b9f581a1996d?q=80&w=1200&auto=format&fit=crop" alt="Steak menyusu">
            <div class="label">
                <div>
                    <h2>Steak menyusu</h2>
                    <p>Közdə bişmiş ətlər</p>
                </div>
                <span class="arrow">→</span>
            </div>
        </a>

    </div>

</div>

<script>
/* 3D əyilmə + kursoru izləyən işıq */
const cards = document.querySelectorAll('.menu');
const canHover = window.matchMedia('(hover:hover)').matches;

if (canHover) {
  cards.forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const rx = ((y / r.height) - .5) * -10;
      const ry = ((x / r.width) - .5) * 10;
      card.style.setProperty('--mx', x + 'px');
      card.style.setProperty('--my', y + 'px');
      card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.03)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
    });
  });
}

/* Yuxarı qalxan közərti hissəcikləri */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, dots = [];

function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

function spawn(initial){
  return {
    x: Math.random() * W,
    y: initial ? Math.random() * H : H + 10,
    r: Math.random() * 2.2 + .6,
    s: Math.random() * .6 + .25,
    w: Math.random() * Math.PI * 2,
    a: Math.random() * .6 + .2
  };
}
for (let i = 0; i < 55; i++) dots.push(spawn(true));

const still = matchMedia('(prefers-reduced-motion:reduce)').matches;

function tick(){
  ctx.clearRect(0, 0, W, H);
  dots.forEach((d, i) => {
    d.y -= d.s;
    d.w += .02;
    d.x += Math.sin(d.w) * .4;
    if (d.y < -10) dots[i] = spawn(false);
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,170,80,${d.a})`;
    ctx.shadowColor = 'rgba(255,140,40,.9)';
    ctx.shadowBlur = 10;
    ctx.fill();
  });
  if (!still) requestAnimationFrame(tick);
}
tick();
</script>

</body>
</html>
